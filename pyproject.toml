[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.2.0"
description = "Retail analytics, customer intelligence, demand planning, and inventory decision support."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "huggingface-hub>=0.24",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "cloudpickle>=3.0",
    "duckdb>=1.1",
    "lightning>=2.4",
    "matplotlib>=3.8",
    "mlflow>=2.17",
    "numpy>=1.26",
    "optuna>=4.0",
    "prophet>=1.1",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "torch>=2.4",
    "tqdm>=4.66",
]
database = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
]
dashboard = [
    "streamlit>=1.38",
    "plotly>=5.24",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[project.scripts]
retailpulse-f01 = "retailpulse.f01_data_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
