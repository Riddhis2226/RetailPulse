name: F01 CI

on:
  push:
    branches: [main]
    paths:
      - "src/retailpulse/f01_data_pipeline/**"
      - "tests/test_f01_pipeline.py"
      - "pyproject.toml"
      - "requirements-f01.txt"
      - ".github/workflows/f01-ci.yml"
  pull_request:
    paths:
      - "src/retailpulse/f01_data_pipeline/**"
      - "tests/test_f01_pipeline.py"
      - "pyproject.toml"
      - "requirements-f01.txt"
      - ".github/workflows/f01-ci.yml"

jobs:
  test-f01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-f01.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-f01.txt pytest
      - run: pip install --no-deps .
      - run: python -m compileall -q src/retailpulse/f01_data_pipeline
      - run: pytest -q tests/test_f01_pipeline.py
